name: Bug
description: Something isn't working
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Frontend, Backend, Both, Not sure]
